[package]
name = "ups-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ups-common = { path = "../ups-common" }
hidapi = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.19"
eframe = "0.29"
egui = "0.29"
material-icons = "0.3"
rand = "0.8"
tracing-appender = "0.2"
# Decodes assets/icon.ico (if present) into raw RGBA for the window/taskbar icon.
image = { version = "0.25", default-features = false, features = ["ico"] }

[target.'cfg(windows)'.dependencies]
# Used to surface fatal startup errors from the windowed exe (no console).
native-dialog = "0.7"
# HidD_SetOutputReport: some UPS models (e.g. large Smart-UPS units) have no
# interrupt OUT endpoint, so hidapi's generic write() can't send an Output
# report — only the Windows HID control-transfer API can. Used by ups-probe
# to query APC's legacy "smart protocol" ASCII tunnel.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Security",
] }

[target.'cfg(windows)'.build-dependencies]
# Embeds assets/icon.ico (if present) as the .exe's own icon.
winres = "0.1"
